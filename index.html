<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anish Singh</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e1e2f, #3b3b58);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: white;
    }
    .card {
      text-align: center;
      padding: 3rem 4rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    h1 {
      font-size: 2.5rem;
      margin: 0 0 0.5rem 0;
    }
    p {
      font-size: 1.1rem;
      color: #cfcfe6;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Anish Singh</h1>
    <p>Motivated by success.</p>
  </div>
</body>
</html>
